<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pink Petals</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <!-- Background glow -->
    <div id="sun-glow"></div>

    <!-- Falling petals -->
    <div id="petals"></div>


    <!-- =========================
         HUD
    ========================== -->

    <div id="hud">

        <div class="hud-row">

            <span>
                📅 Day
                <span id="day">1</span>
            </span>

            <span>
                💰 $<span id="money">0</span>
            </span>

            <span>
                ⚡ <span id="energy">100</span>
            </span>

        </div>

        <div class="hud-row">

            <span>
                💖 <span id="affection">0</span>
            </span>

            <span>
                🤝 <span id="friendship">0</span>
            </span>

            <span>
                📍 <span id="location">Academy Gate</span>
            </span>

        </div>

    </div>


    <!-- =========================
         TITLE
    ========================== -->

    <div id="title-card">

        <h1>🌸 Pink Petals 🌸</h1>

        <p id="chapter-text">
            Day 1 • Academy Gate
        </p>

    </div>


    <!-- =========================
         CHARACTER AREA
    ========================== -->

    <div id="character-area">

        <img
            id="character"
            src=""
            alt=""
        >

    </div>


    <!-- =========================
         DIALOGUE
    ========================== -->

    <div id="textbox">

        <div id="name"></div>

        <p id="dialogue">
            Welcome to Pink Petals...
        </p>

        <div id="choices"></div>

    </div>

</div>


<!-- JavaScript -->
<script src="script.js"></script>

</body>

</html>
